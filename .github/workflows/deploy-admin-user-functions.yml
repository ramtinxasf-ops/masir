name: Deploy admin user functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy admin functions to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID in repository Actions secrets before running this workflow."
            exit 1
          fi
          supabase functions deploy reset-user-password --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy export-users --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy support-chat --project-ref "$SUPABASE_PROJECT_ID"
