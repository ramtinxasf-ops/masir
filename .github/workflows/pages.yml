name: Deploy Masir to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          touch .nojekyll
          mkdir -p _site
          cp -a index.html .nojekyll _site/
          if [ -d assets ]; then cp -a assets _site/; fi
          if [ -d css ]; then cp -a css _site/; fi
          if [ -d js ]; then cp -a js _site/; fi
          if [ -d images ]; then cp -a images _site/; fi
          if [ -d img ]; then cp -a img _site/; fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
